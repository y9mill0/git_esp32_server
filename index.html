<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 TERMINAL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'VT323', monospace;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      text-shadow: 0 0 5px #ffffff;
      position: relative;
      overflow-x: hidden;
    }

    /* Эффект сканлайнов (CRT-монитор) */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25),
        rgba(0, 0, 0, 0.25) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Виньетка по краям */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 11;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background: #000000;
      border: 2px solid #f0f0f0;
      padding: 25px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 5;
    }

    .header {
      border-bottom: 1px dashed #f0f0f0;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .header-line {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 5px;
    }

    .cursor::after {
      content: "_";
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    .box {
      border: 1px solid #f0f0f0;
      padding: 15px;
      margin-bottom: 20px;
    }

    .box-title {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 5px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      padding: 4px 0;
      border-bottom: 1px dotted #333333;
    }

    .row:last-child { border-bottom: none; }

    .label { color: #888888; }
    .value { color: #f0f0f0; }

    .temp-big {
      font-size: 52px;
      text-align: center;
      padding: 15px 0;
      letter-spacing: 4px;
      animation: flicker 4s infinite;
      transition: color 0.3s;
    }

    @keyframes flicker {
      0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
      20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.7; }
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: #888888;
      text-align: center;
      border-top: 1px dashed #f0f0f0;
      padding-top: 10px;
    }

    .glow {
      text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header glow">
      <div class="header-line">
        <span>ESP32@TERMINAL:~#</span>
        <span class="cursor">ONLINE</span>
      </div>
    </div>

    <div class="box">
      <div class="box-title">[ SYSTEM INFO ]</div>
      <div class="row"><span class="label">IP ADDRESS ....</span><span class="value" id="ip">192.168.4.1</span></div>
      <div class="row"><span class="label">UPTIME ........</span><span class="value" id="uptime">0h 0m 0s</span></div>
      <div class="row"><span class="label">REQUESTS ......</span><span class="value" id="requests">0</span></div>
      <div class="row"><span class="label">SSID ..........</span><span class="value">ESP32_Terminal</span></div>
    </div>

    <div class="box">
      <div class="box-title">[ CHIP TEMPERATURE ]</div>
      <div class="temp-big glow" id="temp">--.- °C</div>
    </div>

    <div class="footer">
      SYS_READY · ESP32 CORE TEMP SENSOR · LIVE UPDATE
    </div>
  </div>

  <script>
    // --- ЗАГЛУШКА ДЛЯ ПРЕДПРОСМОТРА ---
    // В реальном коде ESP32 эти данные приходят с сервера.
    // Здесь мы симулируем их, чтобы вы увидели, как работает живое обновление.
    
    let simTemp = 45.0;
    let simUptime = 0;
    let simRequests = 42;

    function updateTemp() {
      // Симуляция колебания температуры (как будто чип нагревается/остывает)
      simTemp += (Math.random() - 0.45) * 0.8;
      if (simTemp < 38) simTemp = 38;
      if (simTemp > 70) simTemp = 70;
      
      document.getElementById('temp').textContent = simTemp.toFixed(1) + ' °C';
    }

    function updateSystemInfo() {
      simUptime++;
      simRequests++;
      
      const h = Math.floor(simUptime / 3600);
      const m = Math.floor((simUptime % 3600) / 60);
      const s = simUptime % 60;
      
      document.getElementById('uptime').textContent = h + 'h ' + m + 'm ' + s + 's';
      document.getElementById('requests').textContent = simRequests;
    }

    // Температура обновляется каждую секунду (плавно, без перезагрузки)
    updateTemp();
    setInterval(updateTemp, 1000);

    // Системная информация — раз в 5 секунд
    setInterval(updateSystemInfo, 5000);
  </script>
</body>
</html>
