<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 · Автономный сервер</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0; min-height: 100vh; padding: 20px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .container {
      max-width: 720px; width: 100%;
      background: rgba(30, 30, 50, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    }
    h1 {
      text-align: center; font-size: 28px;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; margin-bottom: 8px;
    }
    .subtitle { text-align: center; color: #8892a0; font-size: 14px; margin-bottom: 25px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 25px; }
    .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; text-align: center; }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8892a0; margin-bottom: 6px; }
    .stat-value { font-size: 16px; font-weight: 600; color: #4facfe; word-break: break-all; }
    .control-section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .control-section h2 { font-size: 16px; margin-bottom: 15px; color: #ffffff; }
    .led-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
    .led-indicator { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .dot { width: 16px; height: 16px; border-radius: 50%; background: #00e676; box-shadow: 0 0 15px #00e676; animation: pulse 1.5s infinite; transition: background 0.3s, box-shadow 0.3s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    button { background: linear-gradient(90deg, #4facfe, #00f2fe); border: none; color: #0f172a; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.2s; }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    .footer { text-align: center; color: #5a6472; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ ESP32 Автономный Сервер</h1>
    <p class="subtitle">Работает без домашнего Wi-Fi роутера</p>
    <div class="stats">
      <div class="stat-card"><div class="stat-label">IP-адрес</div><div class="stat-value">192.168.4.1</div></div>
      <div class="stat-card"><div class="stat-label">Время работы</div><div class="stat-value">0ч 5м 23с</div></div>
      <div class="stat-card"><div class="stat-label">Запросов</div><div class="stat-value">42</div></div>
    </div>
    <div class="control-section">
      <h2>💡 Управление встроенным светодиодом</h2>
      <div class="led-row">
        <div class="led-indicator">
          <span class="dot" id="dot"></span>
          <span>Светодиод: <span id="ledText">ВКЛЮЧЕН</span></span>
        </div>
        <button onclick="toggleLED()">Переключить</button>
      </div>
    </div>
    <div class="footer">Сеть: ESP32_Server · ESP32 Local Server</div>
  </div>
  <script>
    let ledState = true;
    function toggleLED() {
      ledState = !ledState;
      const dot = document.getElementById('dot');
      const text = document.getElementById('ledText');
      if (ledState) {
        dot.style.background = '#00e676';
        dot.style.boxShadow = '0 0 15px #00e676';
        text.textContent = 'ВКЛЮЧЕН';
      } else {
        dot.style.background = '#ff5252';
        dot.style.boxShadow = '0 0 15px #ff5252';
        text.textContent = 'ВЫКЛЮЧЕН';
      }
    }
  </script>
</body>
</html>
